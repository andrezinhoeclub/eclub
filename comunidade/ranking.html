<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Ranking CL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=3.6">
</head>
<body>
<style>
.rk-cab{display:flex;align-items:center;gap:10px;padding:12px 14px}
.rk-cab h1{margin:0;font-size:1.2rem;flex:1}
.rk-abas{display:flex;background:var(--cartao);border-bottom:1px solid var(--linha)}
.rk-abas button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font:600 .9rem Inter,sans-serif;color:var(--suave);cursor:pointer}
.rk-abas button.sel{color:var(--texto);border-bottom-color:var(--marca)}
.rk-per{display:flex;gap:8px;padding:10px 12px;background:var(--cartao);border-bottom:1px solid var(--linha);flex-wrap:wrap}
.rk-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px 0}
.rk-f{position:relative;border-radius:10px;overflow:hidden;background:var(--cartao2);cursor:pointer;aspect-ratio:1}
.rk-f .pos{position:absolute;top:6px;left:6px;background:var(--ouro-foil);color:var(--marca-txt);font-weight:800;border-radius:999px;min-width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:.85rem;z-index:2}
.rk-f .inf{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:.78rem;z-index:2}
.rk-m{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--cartao);border-bottom:1px solid var(--linha);text-decoration:none;color:var(--texto)}
.rk-m .pos{flex:0 0 34px;height:34px;border-radius:50%;background:var(--cartao2);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--marca)}
.rk-m .tx{flex:1}
.rk-m small{color:var(--suave)}
</style>

<main>
  <div class="cartao" id="carregando"><p class="suave">Carregando…</p></div>
  <div class="oculto" id="tela">
    <div class="cartao rk-cab"><img src="logo-ouro.png" alt="" style="width:30px;height:30px;object-fit:contain"><h1>Ranking CL</h1></div>
    <div class="rk-abas" id="abas"><button type="button" class="sel" data-a="fotos">📷 Fotos</button><button type="button" data-a="membros">🏆 Membros</button></div>
    <div class="rk-per" id="per">
      <span class="chip sel" data-p="semana">Semana</span><span class="chip" data-p="mes">Mês</span><span class="chip" data-p="sempre">Sempre</span>
    </div>
    <div id="lista"></div>
    <p class="suave" style="padding:10px 14px;font-size:.82rem">O ranking conta as curtidas recebidas nas publicações de fotos do Siga-me e do Fotolog. Curte as fotos que você gostar para ajudar a subir!</p>
  </div>
</main>

<footer><a href="regras.html">Regras e privacidade</a> · ranking.html v1.0</footer>

<script src="config.js?v=1.1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin="anonymous"></script>
<script src="base.js?v=4.7"></script>
<script src="ranking.js?v=1.0"></script>
</body>
</html>
