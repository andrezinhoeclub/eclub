# Monta o APK da Comunidade Liberal (pasta app-comunidade) sozinho, aqui no GitHub.
# Para baixar: aba Actions > "APK Comunidade" > a execução mais recente > Artifacts > comunidade-liberal-apk
name: APK Comunidade

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-comunidade/**'
      - '.github/workflows/apk-comunidade.yml'

jobs:
  montar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Chave de assinatura (segredos APK_KEYSTORE e APK_SENHA)
        env:
          APK_KEYSTORE: ${{ secrets.APK_KEYSTORE }}
          APK_SENHA: ${{ secrets.APK_SENHA }}
        run: |
          if [ -z "$APK_KEYSTORE" ] || [ -z "$APK_SENHA" ]; then
            echo "::error::Faltam os segredos APK_KEYSTORE e/ou APK_SENHA (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$APK_KEYSTORE" | base64 -d > app-comunidade/chave.jks

      - name: Ícone do app (feito a partir da logo da comunidade)
        run: |
          python3 -c 'import PIL' 2>/dev/null || pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          import os
          from PIL import Image
          logo = Image.open('comunidade/logo-ouro.png').convert('RGBA')
          for pasta, t in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = 'app-comunidade/app/src/main/res/mipmap-' + pasta
              os.makedirs(d, exist_ok=True)
              fundo = Image.new('RGBA', (t, t), (11, 10, 9, 255))
              l = logo.copy(); l.thumbnail((int(t * 0.78), int(t * 0.78)))
              fundo.alpha_composite(l, ((t - l.width) // 2, (t - l.height) // 2))
              fundo.convert('RGB').save(d + '/ic_launcher.png')
          PY

      - name: Montar o APK
        working-directory: app-comunidade
        env:
          APK_SENHA: ${{ secrets.APK_SENHA }}
        run: |
          # tira espaços ou quebras de linha que às vezes vêm junto ao colar a senha
          export APK_SENHA="$(printf '%s' "$APK_SENHA" | tr -d '[:space:]')"
          gradle --no-daemon assembleRelease

      - name: Dar nome ao arquivo
        run: cp app-comunidade/app/build/outputs/apk/release/app-release.apk comunidade-liberal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: comunidade-liberal-apk
          path: comunidade-liberal.apk
          retention-days: 30
